name: CI

on:
  pull_request:
    paths-ignore:
      - 'orchestra/**'
      - 'docs/**'
      - '*.md'
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2   # pin = local dev version; upgrades are deliberate PRs
      - run: flutter pub get
      # sqlite3's build hook downloads prebuilt libraries from GitHub releases on
      # every clean checkout. Several jobs fetching at once get rate-limited and
      # receive an error page instead of the library (seen as "Hash of downloaded
      # file ... is bef140a1..."). This runner is a single persistent Mac, so
      # keep verified downloads in a local cache across runs. The hook still
      # checks hashes on anything it downloads; only successful builds save back.
      - name: Restore native-asset downloads
        run: |
          mkdir -p "$HOME/.cache/dhruva-ci/sqlite3" .dart_tool/hooks_runner/shared/sqlite3/build
          rsync -a "$HOME/.cache/dhruva-ci/sqlite3/" .dart_tool/hooks_runner/shared/sqlite3/build/
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - name: Save native-asset downloads
        run: rsync -a --include='download-*/***' --exclude='*' .dart_tool/hooks_runner/shared/sqlite3/build/ "$HOME/.cache/dhruva-ci/sqlite3/"
      - name: Enforce coverage floor (70%)
        run: |
          if [ ! -f coverage/lcov.info ]; then echo "no coverage data"; exit 1; fi
          # Exclusions (see orchestra/DECISIONS.md "COVERAGE FLOOR SCOPE"):
          # - llama_engine_service.dart: native engine glue — its tests need real
          #   dylibs + a model, which CI lacks; unit-tested separately on dev machines
          # - voice/sherpa_voice_service.dart: same story for the sherpa_onnx voice
          #   glue — its real coverage comes from the gated round-trip test that only
          #   runs on the macOS dev machine (native dylib + models); the pure voice
          #   logic (catalog/installer/fake/audio_conversion) is NOT excluded.
          # - voice/mic_audio_source.dart, voice/voice_player.dart: record/audioplayers
          #   platform glue, unrunnable under flutter test.
          # (features/debug_chat's exclusion was deleted with the harness itself
          # in Loop 4 — see orchestra/BLACKBOARD.md.)
          total=$(python3 - << 'PY'
          import re
          recs = open('coverage/lcov.info').read().split('end_of_record')
          excl = (
              'lib/engine_bindings/llama_engine_service.dart',
              'lib/voice/sherpa_voice_service.dart',
              'lib/voice/mic_audio_source.dart',
              'lib/voice/voice_player.dart',
          )
          lf = lh = 0
          for r in recs:
              m = re.search(r'SF:(.+)', r)
              if not m or any(e in m.group(1) for e in excl): continue
              lf += sum(int(x) for x in re.findall(r'^LF:(\d+)', r, re.M))
              lh += sum(int(x) for x in re.findall(r'^LH:(\d+)', r, re.M))
          print(round(100*lh/lf) if lf else 0)
          PY
          )
          echo "coverage (floor scope): ${total}%"
          if [ "$total" -lt 70 ]; then echo "coverage ${total}% below 70% floor"; exit 1; fi

  build-android:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2   # pin = local dev version; upgrades are deliberate PRs
      - run: flutter pub get
      # sqlite3's build hook downloads prebuilt libraries from GitHub releases on
      # every clean checkout. Several jobs fetching at once get rate-limited and
      # receive an error page instead of the library (seen as "Hash of downloaded
      # file ... is bef140a1..."). This runner is a single persistent Mac, so
      # keep verified downloads in a local cache across runs. The hook still
      # checks hashes on anything it downloads; only successful builds save back.
      - name: Restore native-asset downloads
        run: |
          mkdir -p "$HOME/.cache/dhruva-ci/sqlite3" .dart_tool/hooks_runner/shared/sqlite3/build
          rsync -a "$HOME/.cache/dhruva-ci/sqlite3/" .dart_tool/hooks_runner/shared/sqlite3/build/
      - run: flutter build apk --release
      - name: Save native-asset downloads
        run: rsync -a --include='download-*/***' --exclude='*' .dart_tool/hooks_runner/shared/sqlite3/build/ "$HOME/.cache/dhruva-ci/sqlite3/"

  build-ios:
    runs-on: self-hosted  # was macos-latest; this self-hosted runner is a real Mac
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2   # pin = local dev version; upgrades are deliberate PRs
      - run: flutter pub get
      # sqlite3's build hook downloads prebuilt libraries from GitHub releases on
      # every clean checkout. Several jobs fetching at once get rate-limited and
      # receive an error page instead of the library (seen as "Hash of downloaded
      # file ... is bef140a1..."). This runner is a single persistent Mac, so
      # keep verified downloads in a local cache across runs. The hook still
      # checks hashes on anything it downloads; only successful builds save back.
      - name: Restore native-asset downloads
        run: |
          mkdir -p "$HOME/.cache/dhruva-ci/sqlite3" .dart_tool/hooks_runner/shared/sqlite3/build
          rsync -a "$HOME/.cache/dhruva-ci/sqlite3/" .dart_tool/hooks_runner/shared/sqlite3/build/
      - run: flutter build ios --no-codesign
      - name: Save native-asset downloads
        run: rsync -a --include='download-*/***' --exclude='*' .dart_tool/hooks_runner/shared/sqlite3/build/ "$HOME/.cache/dhruva-ci/sqlite3/"
