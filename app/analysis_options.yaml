include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - third_party/** # vendored pdf_cos (Apache-2.0), upstream style
    # `flutter test` copies the bundled pubspec.yaml here, whose relative
    # `path:` deps do not resolve from inside build/.
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements
