# ffigen config for stable-diffusion.cpp (Loop 8, ADR-001 "own it" path).
#
# Regenerate: cd app && dart run ffigen --config ffigen_sd.yaml
#
# The header is PINNED to the vendored submodule at commit b290693. The struct
# layout is tightly coupled to that commit (the param structs grow release to
# release), so a sd.cpp bump is a deliberate re-gen + re-verify PR — never an
# incidental upgrade. Only the handful of C entry points the ImageGenService
# actually calls are bound; the video/upscaler/adetailer/convert surface is
# excluded to keep the generated file small.
name: SdBindings
description: |
  FFI bindings to stable-diffusion.cpp, pinned to
  engine/sd/vendor/stable-diffusion.cpp @ b290693.
output: 'lib/imagine_engine/sd_bindings.g.dart'
llvm-path:
  - '/Library/Developer/CommandLineTools/usr/lib'
  - '/opt/homebrew/opt/llvm'
headers:
  entry-points:
    - '../engine/sd/vendor/stable-diffusion.cpp/include/stable-diffusion.h'
  include-directives:
    - '**/stable-diffusion.h'
functions:
  include:
    - 'sd_ctx_params_init'
    - 'new_sd_ctx'
    - 'free_sd_ctx'
    - 'sd_ctx_supports_image_generation'
    - 'sd_img_gen_params_init'
    - 'sd_sample_params_init'
    - 'generate_image'
    - 'free_sd_images'
    - 'sd_cancel_generation'
    - 'sd_set_progress_callback'
    - 'sd_set_log_callback'
    - 'sd_get_num_physical_cores'
structs:
  include:
    - 'sd_ctx_params_t'
    - 'sd_img_gen_params_t'
    - 'sd_image_t'
enums:
  include:
    - 'sd_type_t'
    - 'sd_cancel_mode_t'
    - 'sample_method_t'
    - 'schedule.*'
    - 'sd_log_level_t'
silence-enum-warning: true
comments:
  style: any
  length: brief
preamble: |
  // GENERATED by package:ffigen from stable-diffusion.h @ b290693.
  // DO NOT EDIT BY HAND. Regenerate via: dart run ffigen --config ffigen_sd.yaml
  // ignore_for_file: type=lint, unused_field, camel_case_types, non_constant_identifier_names, constant_identifier_names, unused_element, doc_directive_unknown
